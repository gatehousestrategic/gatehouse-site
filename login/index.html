<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client login | Gatehouse Strategic</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0d2a4c;
  --navy-2: #163a63;
  --blue: #3d8bd6;
  --blue-light: #a9cdf0;
  --pale: #e3eaf2;
  --line: #9cbde0;
  --line-soft: #d3dde8;
  --text: #34465c;
  --bad: #a8321f;
  --serif: "Spectral", Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #fff; color: var(--text); font: 400 16px/1.6 var(--serif); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
a { color: inherit; }
h1, p { margin: 0; }

.bar { background: var(--navy); color: #fff; }
.bar-in { max-width: 1440px; margin: 0 auto; height: 86px; display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; padding-left: 40px; text-decoration: none; font-family: var(--serif); font-size: 24px; line-height: 1; }
.logo .mark { width: 42px; height: 42px; margin-right: 12px; }
.logo small { display: block; font: 600 10px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--blue-light); margin-top: 6px; }
.back { height: 100%; display: flex; align-items: center; padding: 0 40px; border-left: 1px solid rgba(255,255,255,.18); font: 700 12px/1 var(--sans); letter-spacing: .03em; text-transform: uppercase; text-decoration: none; }
.back:hover { background: var(--navy-2); }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.side { background: var(--pale); border-right: 1px solid var(--line); padding: 120px 80px; display: flex; flex-direction: column; justify-content: flex-end; }
.side h1 { color: var(--navy); font-weight: 400; font-size: clamp(34px, 3vw, 46px); line-height: 1.15; max-width: 12em; }
.side p { margin-top: 22px; max-width: 30em; font-size: 17.5px; line-height: 1.6; }
.panel { padding: 120px 80px; display: flex; align-items: center; }
form { width: 100%; max-width: 420px; }
label { display: block; font: 600 14px/1.2 var(--sans); color: var(--navy); margin-bottom: 12px; }
.code { width: 100%; font: 500 26px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--navy); padding: 18px 18px; border: 1px solid var(--line); border-radius: 2px; background: #fff; }
.code:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
.code[aria-invalid="true"] { border-color: var(--bad); }
.hint { margin-top: 12px; font: 400 14px/1.5 var(--sans); color: #66768a; }
.err { margin-top: 12px; font: 500 14px/1.5 var(--sans); color: var(--bad); min-height: 21px; }
button { margin-top: 18px; width: 100%; height: 56px; border: 0; border-radius: 2px; background: var(--navy); color: #fff; font: 600 15px/1 var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
button:hover { background: var(--navy-2); }
button[disabled] { opacity: .6; cursor: progress; }
button::after { content: "→"; color: var(--blue-light); }
.help { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line-soft); font: 400 14.5px/1.6 var(--sans); }
.help a { color: var(--navy); font-weight: 600; text-underline-offset: 4px; }

@media (max-width: 900px) {
  .bar-in { height: 72px; }
  .logo { padding-left: 18px; }
  .back { padding: 0 18px; }
  main { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 56px 22px 40px; }
  .panel { padding: 40px 22px 72px; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="../" aria-label="Gatehouse Strategic home"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M21 49V29a11 11 0 0 1 22 0v20" fill="none" stroke="#ffffff" stroke-width="4.5"/><path d="M15 49.5h34" stroke="#3d8bd6" stroke-width="4.5"/></svg><span>Gatehouse<small>Strategic</small></span></a>
    <a class="back" href="../">Back to site</a>
  </div>
</header>

<main>
  <section class="side">
    <h1>Client login</h1>
    <p>Enter the access code we sent you to open your project page: previews, drafts and documents we're working on together.</p>
  </section>

  <section class="panel">
    <form id="f" novalidate>
      <label for="code">Access code</label>
      <input class="code" id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="24" required>
      <p class="hint">Letters and numbers. Dashes and spaces don't matter.</p>
      <p class="err" id="err" role="alert"></p>
      <button type="submit" id="go">Open my page</button>
      <p class="help">No code, or it isn't working? Email <a href="mailto:hello@gatehousestrategic.com">hello@gatehousestrategic.com</a>.</p>
    </form>
  </section>
</main>

<script src="../portal/api.js?v=5"></script>
<script>
// Codes are checked by the database (supabase/portal.sql). A match returns a
// short-lived session, and the client's page opens at /portal/.
(function () {
  var f = document.getElementById("f");
  var input = document.getElementById("code");
  var err = document.getElementById("err");
  var go = document.getElementById("go");

  if (/expired/.test(location.search)) err.textContent = "Your session ended. Please enter your code again.";
  if (/signed-out/.test(location.search)) err.textContent = "";

  function fail(msg) {
    err.textContent = msg;
    input.setAttribute("aria-invalid", "true");
    go.disabled = false;
  }

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    input.removeAttribute("aria-invalid");
    var norm = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (norm.length < 6) return fail("Please enter the full code.");
    go.disabled = true;
    var adminJwt = GH_PORTAL.adminBearer();
    GH_PORTAL.rpc("portal_login", { p_code: norm }, adminJwt).catch(function (e) {
      if (adminJwt) return GH_PORTAL.rpc("portal_login", { p_code: norm });
      throw e;
    }).then(function (res) {
      if (res && res.ok) {
        GH_PORTAL.setToken(res.token);
        location.href = "../portal/";
        return;
      }
      if (res && res.error === "too_many") return fail("Too many attempts. Please wait 15 minutes and try again.");
      fail("That code didn't match. Check it and try again.");
    }).catch(function () {
      fail("We couldn't check your code just now. Please try again.");
    });
  });
})();
</script>
</body>
</html>
